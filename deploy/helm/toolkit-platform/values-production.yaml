# Production preset (scaffold): platform-host + OoP gears from a real registry.
#
# NOTE: this is a starting point for the production stack. It assumes images are
# published to ghcr.io/cyberfabric and pulled normally. Production hardening
# (real database backends, prod plugin presets, SA-token enforcement + RBAC,
# resource tuning, network policies) is tracked in OoP-8 and follow-ups.
#
#   helm install platform deploy/helm/toolkit-platform -f deploy/helm/toolkit-platform/values-production.yaml

platform-host:
  enabled: true
  fullnameOverride: platform-host
  replicaCount: 1
  image:
    repository: ghcr.io/cyberfabric/platform-host
    tag: "dev"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

hello:
  enabled: true
  fullnameOverride: hello
  replicaCount: 2
  image:
    repository: ghcr.io/cyberfabric/hello
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"
