apiVersion: v2
name: toolkit-platform
description: >-
  CF/Gears ToolKit platform umbrella chart. Deploys flight-control (the minimal
  control plane: edge + DirectoryService + system gears) together with a set of
  out-of-process gears. Target: Profile 3 (Kubernetes).
type: application
version: 0.1.0
appVersion: "dev"
dependencies:
  - name: flight-control
    version: 0.1.0
    repository: "file://../flight-control"
    condition: flight-control.enabled
  - name: postgres
    version: 0.1.0
    repository: "file://../postgres"
    condition: postgres.enabled
  - name: authz-resolver
    version: 0.1.0
    repository: "file://../authz-resolver"
    condition: authz-resolver.enabled
  - name: hello
    version: 0.1.0
    repository: "file://../hello"
    condition: hello.enabled
  - name: users-info
    version: 0.1.0
    repository: "file://../users-info"
    condition: users-info.enabled
  - name: api-contracts
    version: 0.1.0
    repository: "file://../api-contracts"
    condition: api-contracts.enabled
  - name: api-contracts-consumer
    version: 0.1.0
    repository: "file://../api-contracts-consumer"
    condition: api-contracts-consumer.enabled
