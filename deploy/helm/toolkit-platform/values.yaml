# Default values for the toolkit-platform umbrella chart.
#
# Subchart values are nested under the subchart name. The platform-host is given
# a stable fullnameOverride ("platform-host") so its Service DNS is predictable
# and every OoP gear can reference it for TOOLKIT_DIRECTORY_ENDPOINT and the edge.

platform-host:
  enabled: true
  fullnameOverride: platform-host
  image:
    repository: ghcr.io/cyberfabric/platform-host
    tag: "dev"
    pullPolicy: IfNotPresent

# Shared PostgreSQL: one server, a database per OoP gear. OoP gears connect to
# it (postgres.enabled=false on the gear) instead of each bundling their own.
postgres:
  enabled: true
  fullnameOverride: shared-postgres
  databases:
    - usersinfo
    - simpleusersettings
    - filestorage
    - chatengine

hello:
  enabled: true
  fullnameOverride: hello
  image:
    repository: ghcr.io/cyberfabric/hello
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"

users-info:
  enabled: true
  fullnameOverride: users-info
  image:
    repository: ghcr.io/cyberfabric/users-info
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"
  # Use the shared Postgres (above) instead of a bundled one. `host` must match
  # the shared server's Service name; `database` must be one of its `databases`.
  postgres:
    enabled: false
    host: shared-postgres
    database: usersinfo
    user: platform
    password: "platform-demo-pw"

simple-user-settings:
  enabled: true
  fullnameOverride: simple-user-settings
  image:
    repository: ghcr.io/cyberfabric/simple-user-settings
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"
  # Use the shared Postgres (above) instead of a bundled one. `host` must match
  # the shared server's Service name; `database` must be one of its `databases`.
  postgres:
    enabled: false
    host: shared-postgres
    database: simpleusersettings
    user: platform
    password: "platform-demo-pw"

file-storage:
  enabled: true
  fullnameOverride: file-storage
  image:
    repository: ghcr.io/cyberfabric/file-storage
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"
  # Use the shared Postgres (above) instead of a bundled one. `host` must match
  # the shared server's Service name; `database` must be one of its `databases`.
  postgres:
    enabled: false
    host: shared-postgres
    database: filestorage
    user: platform
    password: "platform-demo-pw"

chat-engine:
  enabled: true
  fullnameOverride: chat-engine
  image:
    repository: ghcr.io/cyberfabric/chat-engine
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"
  # Use the shared Postgres (above) instead of a bundled one. `host` must match
  # the shared server's Service name; `database` must be one of its `databases`.
  postgres:
    enabled: false
    host: shared-postgres
    database: chatengine
    user: platform
    password: "platform-demo-pw"

usage-collector:
  enabled: true
  fullnameOverride: usage-collector
  image:
    repository: ghcr.io/cyberfabric/usage-collector
    tag: "dev"
    pullPolicy: IfNotPresent
  directoryEndpoint: "http://platform-host:50051"
