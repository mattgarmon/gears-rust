apiVersion: v2
name: usage-collector
description: >-
  usage-collector - an authenticated REST OoP demo gear. Deploys as its own
  pod, authenticates tenant-plane requests locally (embedded authn stack),
  resolves the central authz-resolver over REST via the platform host's
  DirectoryService for every PEP check. No database of its own — durable
  catalog rows live in the bound storage-plugin backend (ADR-0012); this
  chart embeds the dev/demo no-op plugin. Reverse-proxied by the api-gateway
  edge (Profile 3).
type: application
version: 0.1.0
appVersion: "dev"
dependencies:
  - name: toolkit-common
    version: 0.1.0
    repository: "file://../toolkit-common"
