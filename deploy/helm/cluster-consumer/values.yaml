# Default values for the cluster-consumer (OoP demo gear) chart.

replicaCount: 1

image:
  repository: ghcr.io/constructorfabric/cluster-consumer
  tag: "dev"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

command: ["/app/gear"]
args: ["--config", "/app/config/gear.yaml"]

service:
  type: ClusterIP
  # OoP REST + probes port (matches oop_http.listen_addr).
  port: 9093

grpc:
  enabled: false
  port: 50051

# DirectoryService (platform host grpc-hub) this gear registers with. The
# consumer does NOT use the directory to find cluster — it derives cluster's gRPC
# endpoint by DNS convention (cluster.{POD_NAMESPACE}.svc.cluster.local:50051).
# POD_NAMESPACE is injected automatically by the toolkit-common deployment
# template from the downward API, so no extra config is needed here.
directoryEndpoint: "http://platform-host:50051"

# SA-token projection (audience toolkit-internal): the consumer's remote cluster
# client attaches it as X-ToolKit-Internal-Token on every coordination call
# (cluster's grpc-hub validates it via TokenReview).
saToken:
  enabled: true
  audience: toolkit-internal
  mountPath: /var/run/secrets/tokens/toolkit-internal
  fileName: token
  expirationSeconds: 3600

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 6

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
podLabels: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
nodeSelector: {}
affinity: {}
tolerations: []

# Gear config mounted at /app/config/gear.yaml. advertise_uri uses this gear's
# in-cluster Service DNS so the edge (in the platform-host pod) can reach it.
config:
  mountPath: /app/config/gear.yaml
  fileName: gear.yaml
  data:
    server:
      home_dir: "/app/data"

    logging:
      default:
        console_format: "json"
        console_level: info

    oop_http:
      listen_addr: "0.0.0.0:9093"
      advertise_uri: 'http://{{ include "toolkit-common.fullname" . }}:9093'
      internal_auth:
        provider: kube
        audiences: ["toolkit-internal"]
        token_path: /var/run/secrets/tokens/toolkit-internal/token

    gears:
      cluster-consumer:
        config: {}
