# Default values for the authz-resolver (OoP PDP) chart.

replicaCount: 1

image:
  repository: ghcr.io/constructorfabric/authz-resolver
  tag: "dev"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

command: ["/app/gear"]
args: ["--config", "/app/config/gear.yaml"]

service:
  type: ClusterIP
  # OoP REST + probes port (matches oop_http.listen_addr).
  port: 9092

grpc:
  enabled: false
  port: 50051

# DirectoryService this gear registers with. Injected as TOOLKIT_DIRECTORY_ENDPOINT. 
# Overridden by the umbrella chart to match the flight-control Service name.
directoryEndpoint: "http://flight-control:50051"

# SA-token projection for platform-plane auth. The projected token (audience
# `toolkit-internal`) is mounted so the gear can present it on system calls when
# oop_http.internal_auth is configured (TokenReview-validated by the receiver).
saToken:
  enabled: true
  audience: toolkit-internal
  mountPath: /var/run/secrets/tokens/toolkit-internal
  fileName: token
  expirationSeconds: 3600

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 6

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
podLabels: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
nodeSelector: {}
affinity: {}
tolerations: []

# Gear config mounted at /app/config/gear.yaml. advertise_uri uses this gear's
# in-cluster Service DNS so PEPs (resolving via the DirectoryService) can reach
# it. Mirrors config/oop-authz-resolver.yaml.
config:
  mountPath: /app/config/gear.yaml
  fileName: gear.yaml
  # Structured gear config (see toolkit-common configmap): any leaf is overridable
  # via Helm merge. Keep template-bearing scalars single-quoted so `tpl` resolves.
  data:
    server:
      home_dir: "/app/data"
    logging:
      default:
        console_format: "json"
        console_level: info
    oop_http:
      listen_addr: "0.0.0.0:9092"
      advertise_uri: 'http://{{ include "toolkit-common.fullname" . }}:9092'
      internal_auth:
        provider: kube
        audiences: ["toolkit-internal"]
        token_path: /var/run/secrets/tokens/toolkit-internal/token
    # The PDP plus the dependent gears it embeds in-process. Tenant hierarchy is
    # config-driven (static-tr); a resource-group-backed hierarchy is a separate
    # unit (resource-group depends on authz-resolver, so it cannot be embedded
    # here without a Cargo dependency cycle).
    gears:
      authz-resolver:
        config:
          vendor: "constructorfabric"
      tr-authz-plugin:
        config:
          vendor: "constructorfabric"
          priority: 50
      tenant-resolver:
        config:
          vendor: "constructorfabric"
      static-tr-plugin:
        config:
          vendor: "constructorfabric"
          priority: 20
          tenants:
            # Structural root; must match DEFAULT_TENANT_ID in toolkit-security.
            - id: "00000000-df51-5b42-9538-d2b56b7ee953"
              name: "platform-root"
              parent_id: null
              status: active
