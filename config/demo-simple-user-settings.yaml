# Local multi-process demo: simple-user-settings OoP gear (authenticated + DB).
#
# Run (after the host is up):
#   TOOLKIT_DIRECTORY_ENDPOINT=http://127.0.0.1:50051 \
#     cargo run -p simple-user-settings-oop --bin simple-user-settings-oop -- --config config/demo-simple-user-settings.yaml
#
# Then (bearer required — any non-empty token is accepted by static-authn
# accept_all and mapped to the platform-root tenant):
#   curl -H 'Authorization: Bearer demo' http://127.0.0.1:8087/simple-user-settings/v1/settings   # via edge
#   curl -H 'Authorization: Bearer demo' http://127.0.0.1:9093/simple-user-settings/v1/settings   # direct
#
# The pod authenticates the bearer locally (embedded authn stack), then calls
# the platform-host's authz-resolver over REST (resolved via DirectoryService)
# for every PEP check, and serves from its own SQLite database.

server:
  home_dir: "~/.cf-gears-demo-simple-user-settings"

database:
  servers:
    settings_db:
      engine: "sqlite"
      params:
        WAL: "true"
        synchronous: "NORMAL"
        busy_timeout: "5000"
      pool:
        max_conns: 5
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/demo-simple-user-settings.log"
    file_level: info

# OoP HTTP serving lifecycle: bind a local REST server + register its endpoint
# with the DirectoryService so the edge can proxy to it.
oop_http:
  listen_addr: "127.0.0.1:9093"
  advertise_uri: "http://127.0.0.1:9093"
  allow_loopback_advertise: true

gears:
  # Target gear: needs the db capability + its own config.
  simple-user-settings:
    database:
      server: "settings_db"
      file: "simple_user_settings.db"
    config:
      max_field_length: 100

  # Embedded tenant-plane authn stack (in-memory; no DB).
  authn-resolver:
    config:
      vendor: "constructorfabric"

  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      mode: accept_all

  types-registry:
    config: {}
