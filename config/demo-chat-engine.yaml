# Local multi-process demo: chat-engine OoP gear (authenticated + DB).
#
# Run (after the host is up):
#   TOOLKIT_DIRECTORY_ENDPOINT=http://127.0.0.1:50051 \
#     cargo run -p chat-engine-oop --bin chat-engine-oop -- --config config/demo-chat-engine.yaml
#
# Then (bearer required — any non-empty token is accepted by static-authn
# accept_all and mapped to the platform-root tenant):
#   curl -H 'Authorization: Bearer demo' http://127.0.0.1:8087/chat-engine/v1/sessions   # via edge
#   curl -H 'Authorization: Bearer demo' http://127.0.0.1:9095/chat-engine/v1/sessions   # direct
#
# The pod authenticates the bearer locally (embedded authn stack), then calls
# the platform-host's authz-resolver over REST (resolved via DirectoryService)
# for every PEP check, and serves from its own SQLite database.

server:
  home_dir: "~/.cf-gears-demo-chat-engine"

database:
  servers:
    chat_engine_db:
      engine: "sqlite"
      params:
        WAL: "true"
        synchronous: "NORMAL"
        busy_timeout: "5000"
      pool:
        max_conns: 5
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/demo-chat-engine.log"
    file_level: info

# OoP HTTP serving lifecycle: bind a local REST server + register its endpoint
# with the DirectoryService so the edge can proxy to it.
oop_http:
  listen_addr: "127.0.0.1:9095"
  advertise_uri: "http://127.0.0.1:9095"
  allow_loopback_advertise: true

gears:
  # Target gear: needs the db capability + its own config.
  chat-engine:
    database:
      server: "chat_engine_db"
      file: "chat_engine.db"
    config: {}

  # Embedded tenant-plane authn stack (in-memory; no DB).
  authn-resolver:
    config:
      vendor: "constructorfabric"

  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      mode: accept_all

  types-registry:
    config: {}
