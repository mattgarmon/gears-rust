[package]
name = "cf-gears-authz-resolver"
version = "0.2.5"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AuthZ resolver gear - discovers and routes to plugins"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "authorization"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "authz_resolver"

[lints]
workspace = true

# OoP binary: only built with the `oop_module` feature (async runtime + bootstrap
# entrypoint). The library stays available for in-process linking (Profile 1)
# without the binary.
[[bin]]
name = "authz-resolver-oop"
path = "src/main.rs"
required-features = ["oop_module"]

[features]
default = []
# Build the standalone OoP binary. It embeds the dependent gears needed to
# resolve authorization in-process — tenant-resolver plus the plugins that wire
# the chain (tr-authz -> tenant-resolver, static-tr for config-driven tenants) —
# so the chain's `SecurityContext::anonymous()` calls stay in-process. Tenant
# hierarchy is config-driven here; a resource-group-backed hierarchy is a
# separate unit (resource-group depends on authz-resolver, so it cannot be
# embedded here without a dependency cycle). See docs/arch/toolkit-oop/DESIGN.md
# § Flight Control Composition.
oop_module = [
    "dep:tokio",
    "dep:clap",
    "dep:mimalloc",
    "toolkit/bootstrap",
    "dep:tenant-resolver",
    "dep:tr-authz-plugin",
    "dep:static-tr-plugin",
]
# Kubernetes TokenReview platform-plane auth for the OoP HTTP server.
k8s-auth = ["toolkit/k8s-auth"]

[dependencies]
# Trait boundaries of consumed SDKs are `CanonicalError` (ADR 0005).
toolkit-canonical-errors = { workspace = true }
# Local dependencies
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.5.2", path = "../authz-resolver-sdk", features = [
    "rest-client",
    "rest-server",
] }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.9", path = "../../types-registry/types-registry-sdk" }
types-registry = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-contract = { workspace = true, features = ["runtime-client", "rest-server"] }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Error handling and serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `register_rest` hands an `axum::Router` to the SDK's generated route
# registration; the SDK owns the http/futures/stream deps for that codegen.
axum = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

# Logging
tracing = { workspace = true }

# --- OoP binary only (gated behind `oop_module`) ---
# Async runtime, CLI, and allocator for the standalone OoP entrypoint.
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

# Dependent gears + wiring plugins, embedded in the OoP binary so the chain
# (authz-resolver -> tr-authz -> tenant-resolver, tenants from static-tr) runs in
# one process. Linked purely to pull in their `#[toolkit::gear]` inventory
# registrations; the library never references them. resource-group is
# deliberately NOT embedded — it depends on authz-resolver, which would form a
# Cargo dependency cycle; a resource-group-backed tenant hierarchy is its own
# OoP unit.
tenant-resolver = { package = "cf-gears-tenant-resolver", path = "../../tenant-resolver/tenant-resolver", optional = true }
tr-authz-plugin = { package = "cf-gears-tr-authz-plugin", path = "../plugins/tr-authz-plugin", optional = true }
static-tr-plugin = { package = "cf-gears-static-tr-plugin", path = "../../tenant-resolver/plugins/static-tr-plugin", optional = true }

[dev-dependencies]
# Async test harness + supporting types for the gear/local-client unit tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
