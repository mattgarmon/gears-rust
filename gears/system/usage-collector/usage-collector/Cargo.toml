[package]
name = "cf-gears-usage-collector"
description = "usage-collector gateway module"
version = "0.2.9"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "usage_collector"

[lints]
workspace = true

[features]
default = []
# OoP binary (usage-collector-oop): bootstrap, no-op storage plugin, embedded
# authn stack. `types-registry` is already a hard dep below, so not repeated.
oop_module = [
    "dep:clap",
    "toolkit/bootstrap",
    "dep:authn-resolver",
    "dep:static-authn-plugin",
    "dep:noop-usage-collector-plugin",
]
# Kubernetes TokenReview platform-plane auth.
k8s-auth = ["toolkit/k8s-auth"]

[[bin]]
name = "usage-collector-oop"
path = "src/main.rs"
required-features = ["oop_module"]

[dependencies]
usage-collector-sdk = { workspace = true }
# `types-registry` has no REST contract, so unlike authz-resolver it cannot be
# consumed via `#[toolkit::consumes]` — it stays a hard `deps=[types_registry]`
# link (see module.rs doc comment): resolved as `dyn TypesRegistryClient` from
# the ClientHub at call time for lazy storage-plugin discovery, which only
# works because types-registry is always embedded in-process.
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }
# Consumed via `#[toolkit::consumes]`; rest-client for the resolving client.
authz-resolver-sdk = { workspace = true, features = ["rest-client"] }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
axum = { workspace = true, features = ["macros"] }
utoipa = { workspace = true, features = ["time", "decimal"] }
rust_decimal = { workspace = true }
bigdecimal = { workspace = true }

# Operational metrics: instruments are declared on a scoped `Meter` from
# ToolKit's global `SdkMeterProvider` (OTLP push; no gear-local exporter or
# `/metrics` scrape endpoint) per
# `cpt-cf-usage-collector-principle-otlp-push-emission`.
opentelemetry = { workspace = true }

toolkit = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true }
# Link-time GTS permission catalog (`src/gts/permissions.rs`): declares
# AuthzPermissionV1 instances into the toolkit-gts inventory that
# types-registry aggregates at boot.
toolkit-gts = { workspace = true }
# Direct dep needed because `gts_instance!` expansions reference
# `::gts::*` paths (the compile-time `<S as GtsSchema>::SCHEMA_ID` prefix
# asserts). Without this the proc-macro emits `::gts::…` identifiers that
# cannot be resolved.
gts = { workspace = true }
inventory = { workspace = true }

# OoP-only, gated behind `oop_module`.
clap = { workspace = true, optional = true }
noop-usage-collector-plugin = { package = "cf-gears-noop-usage-collector-plugin", path = "../plugins/noop-usage-collector-plugin", optional = true }
authn-resolver = { package = "cf-gears-authn-resolver", path = "../../authn-resolver/authn-resolver", optional = true }
static-authn-plugin = { package = "cf-gears-static-authn-plugin", path = "../../authn-resolver/plugins/static-authn-plugin", optional = true }

[dev-dependencies]
types-registry-sdk = { workspace = true, features = ["test-util"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` so the bounded
# gauge-refresh timeout can be exercised without a wall-clock delay.
tokio = { workspace = true, features = ["test-util"] }
# In-memory metric exporter + `SdkMeterProvider` for asserting emitted
# instrument names / labels / buckets against DESIGN §3.11.5. Test-only —
# the gear never constructs an exporter at runtime (ToolKit owns it).
opentelemetry_sdk = { workspace = true, features = ["testing"] }
toolkit-gts = { workspace = true }
# Test-only: parses `docs/usage-collector-v1.yaml` for the OpenAPI contract
# conformance test.
serde-saphyr = { workspace = true }
# Test-only: `ServiceExt::oneshot` drives one request through the assembled
# `Router` so `register_routes`' `Extension<Arc<Service>>` layer — invisible
# to the OpenAPI registry — is pinned by dispatch.
tower = { workspace = true }
