[package]
name = "cf-gears-file-parser"
version = "0.1.33"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "File Parser module"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["parsing"]
metadata.docs.rs.all-features = true

[lib]
name = "file_parser"

[lints]
workspace = true

[features]
default = []
# Build the out-of-process (OoP) binary that serves this gear standalone and
# self-registers with the platform-host DirectoryService. Enables the
# `file-parser-oop` bin target. Kept off by default so the library crate stays
# publishable without the extra bootstrap dependencies.
oop_module = ["dep:clap", "dep:mimalloc", "toolkit/bootstrap"]

[[bin]]
name = "file-parser-oop"
path = "src/bin/oop.rs"
required-features = ["oop_module"]

[dependencies]
# Core dependencies
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }

# Serde and JSON schema
serde = { workspace = true }
utoipa = { workspace = true, features = ["time"] }

# HTTP and REST
axum = { workspace = true, features = ["macros", "multipart"] }
http = { workspace = true }

# Time handling
time = { workspace = true }

# UUID support
uuid = { workspace = true }


# Error handling
thiserror = { workspace = true }

# Bytes handling
bytes = { workspace = true }

# Futures and async streaming
futures-util = { workspace = true }

# Base64 encoding (used by stub parser)
base64 = { workspace = true }

# Temp file handling
tempfile = { workspace = true }

# Document parsing libraries
kreuzberg = { workspace = true }

# MIME type parsing
mime = { workspace = true }

docx-rust = { workspace = true }

# OoP binary only (gated by `oop_module`).
clap = { workspace = true, optional = true }
mimalloc = { version = "0.1", optional = true }

# Local dependencies
toolkit = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }
