syntax = "proto3";

package directory.v1;

import "google/protobuf/empty.proto";

// DirectoryService provides service discovery for gRPC and REST services.
// OoP gears use this to register themselves and discover other services.
service DirectoryService {
  // Resolve a gRPC service name to an endpoint URI
  rpc ResolveGrpcService(ResolveGrpcServiceRequest) returns (ResolveGrpcServiceResponse);

  // Resolve a REST endpoint (HTTP base URL) for a gear by its name
  rpc ResolveRestService(ResolveRestServiceRequest) returns (ResolveRestServiceResponse);

  // Retrieve the OpenAPI spec (JSON) published by a gear
  rpc GetOpenApiSpec(GetOpenApiSpecRequest) returns (GetOpenApiSpecResponse);

  // List all instances of a specific gear
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);

  // List all instances across every registered gear (edge/gateway discovery).
  //
  // This response is a lightweight discovery snapshot: instances carry their
  // identity and REST endpoint but never the full OpenAPI document (only its
  // `openapi_spec_hash`), so the aggregated payload stays small and bounded
  // even with many gears. The edge fetches a gear's document once, on first
  // discovery, via `GetOpenApiSpec`.
  rpc ListAllInstances(ListAllInstancesRequest) returns (ListAllInstancesResponse);

  // Register a new gear instance with the directory
  rpc RegisterInstance(RegisterInstanceRequest) returns (RegisterInstanceResponse);

  // Deregister a gear instance (for graceful shutdown)
  rpc DeregisterInstance(DeregisterInstanceRequest) returns (google.protobuf.Empty);

  // Send a heartbeat to indicate an instance is still alive
  rpc Heartbeat(HeartbeatRequest) returns (google.protobuf.Empty);
}

message ResolveGrpcServiceRequest {
  string service_name = 1;
}

message ResolveGrpcServiceResponse {
  string endpoint_uri = 1;
}

message ResolveRestServiceRequest {
  string gear_name = 1;
}

message ResolveRestServiceResponse {
  string endpoint_uri = 1;
}

message GetOpenApiSpecRequest {
  string gear_name = 1;
}

message GetOpenApiSpecResponse {
  string openapi_spec = 1;
}

message ListInstancesRequest {
  string gear_name = 1;
  map<string, string> match_labels = 2;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_REGISTERED = 1;
  INSTANCE_STATE_READY = 2;
  INSTANCE_STATE_HEALTHY = 3;
  INSTANCE_STATE_QUARANTINED = 4;
  INSTANCE_STATE_DRAINING = 5;
}

// What an instance declares about itself in RegisterInstance / Heartbeat
// (ADR-0011). The directory derives the observable InstanceState from this plus
// the instance lease; it never writes it from a background task.
enum ReportedState {
  // Unset: an older worker that does not report its state. On RegisterInstance
  // this is read as STARTING; on Heartbeat it is read as SERVING, so a worker
  // that only ever heartbeats keeps today's Registered -> Healthy behaviour.
  REPORTED_STATE_UNSPECIFIED = 0;
  REPORTED_STATE_STARTING = 1;
  REPORTED_STATE_SERVING = 2;
  REPORTED_STATE_DRAINING = 3;
}

message InstanceInfo {
  reserved 6;
  reserved "openapi_spec";
  string gear_name = 1;
  string instance_id = 2;
  string endpoint_uri = 3;
  string version = 4;
  optional string rest_endpoint_uri = 5;
  optional string openapi_spec_hash = 7;
  map<string, string> labels = 8;
  InstanceState state = 9;
}

message ListInstancesResponse {
  repeated InstanceInfo instances = 1;
}

message ListAllInstancesRequest {}

message ListAllInstancesResponse {
  repeated InstanceInfo instances = 1;
}

// Represents a gRPC service endpoint with its name and URI
message GrpcServiceEndpoint {
  string service_name = 1;
  string endpoint_uri = 2;
}

message RegisterInstanceRequest {
  string gear_name = 1;
  string instance_id = 2;
  repeated GrpcServiceEndpoint grpc_services = 3;
  string version = 4;
  optional string rest_endpoint_uri = 5;
  optional string openapi_spec = 6;
  map<string, string> labels = 7;
  // State the registrant reports about itself (ADR-0011). Unset/UNSPECIFIED is
  // read as STARTING on a new record; on a re-registration it leaves the stored
  // state unchanged, so a self-heal re-register never resets a serving instance.
  optional ReportedState reported_state = 8;
}

// Response to RegisterInstance. Replaces google.protobuf.Empty; an empty
// message and one carrying an unknown field decode the same way, so old clients
// that expected Empty are unaffected.
message RegisterInstanceResponse {
  // The lease TTL the directory granted, in milliseconds. New workers heartbeat
  // every lease_ttl_ms / 3; 0 means the directory returned no TTL and the
  // worker falls back to its configured heartbeat interval.
  uint64 lease_ttl_ms = 1;
}

message DeregisterInstanceRequest {
  string gear_name = 1;
  string instance_id = 2;
}

message HeartbeatRequest {
  string gear_name = 1;
  string instance_id = 2;
  // State the instance reports about itself (ADR-0011). Unset/UNSPECIFIED is
  // read as SERVING, preserving today's behaviour for workers that only
  // heartbeat. A draining worker sends DRAINING here.
  optional ReportedState reported_state = 3;
}
